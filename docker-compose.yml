# Local development stack. Put secrets in a git-ignored .env file next to this file, e.g.
#   POSTGRES_PASSWORD=<local password>
#   JwtSettings__Secret=<at least 32 random characters>
name: hopaut

services:
  api:
    build: .
    depends_on:
      - db
      - redis
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=hopaut;Username=${POSTGRES_USER:-hopaut};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ConnectionStrings__Redis: redis:6379
      JwtSettings__Secret: ${JwtSettings__Secret:-}
    ports:
      - "8080:8080"

  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hopaut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hopaut
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db-data:
